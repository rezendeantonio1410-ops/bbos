  <title id="title">A origem em camadas: posição, clima, solo, lavoura, torra e xícara</title>
  <desc id="desc">Ilustração conceitual de uma encosta com cafeeiros, solo vermelho sobre basalto e a passagem do grão por manejo, torra e prova. Não é um mapa nem representa valores de uma propriedade.</desc>
