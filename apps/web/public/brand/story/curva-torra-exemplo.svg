<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Curva de torra conceitual com ponto de retorno</title>
<desc id="desc">Leitura ilustrativa da sonda: 140 graus Celsius antes da entrada dos grãos, queda até 85 graus Celsius no ponto de retorno, situado neste exemplo perto de 50 segundos, e subida até 202 graus Celsius na saída. O RoR de 18 graus por minuto marca um instante da subida. A linha indica secagem, reações de Maillard, primeiro estalo e desenvolvimento. Os valores e tempos não são dados medidos nem uma receita universal.</desc>
<defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f7f6f0"/><stop offset="1" stop-color="#edeae0"/></linearGradient><linearGradient id="under" x2="0" y2="1"><stop stop-color="#d9b87d" stop-opacity=".26"/><stop offset="1" stop-color="#d9b87d" stop-opacity="0"/></linearGradient></defs>
<rect width="960" height="460" fill="url(#paper)"/>
<g font-family="Montserrat,Inter,Arial,sans-serif">
<text x="40" y="38" fill="#294650" font-size="16" letter-spacing="2" font-weight="800">EXEMPLO VISUAL · NÃO É UMA MEDIÇÃO</text>
<g stroke="#aebcb8" stroke-width="1.5" stroke-dasharray="5 8" opacity=".8"><path d="M122 142H865"/><path d="M122 212H865"/><path d="M122 282H865"/></g>
<path d="M122 68V350H865" fill="none" stroke="#294650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M855 344l10 6-10 6M116 78l6-10 6 10" fill="none" stroke="#294650" stroke-width="3" stroke-linecap="round"/>
<path d="M135 200C165 274 183 311 218 311C258 311 284 294 315 263C385 202 441 159 512 143C578 130 610 122 650 115C725 104 786 94 830 88L830 350H135Z" fill="url(#under)"/>
<path d="M135 200C165 274 183 311 218 311C258 311 284 294 315 263C385 202 441 159 512 143C578 130 610 122 650 115C725 104 786 94 830 88" fill="none" stroke="#0e191d" stroke-width="7" stroke-linecap="round"/>
<g fill="#0e191d" stroke="#f7f6f0" stroke-width="4"><circle cx="135" cy="200" r="9"/><circle cx="830" cy="88" r="9"/></g>
<circle cx="218" cy="311" r="10" fill="#d9b87d" stroke="#0e191d" stroke-width="3"/>
<text x="135" y="159" fill="#294650" font-size="14" font-weight="800" letter-spacing="1">CARGA</text>
<text x="135" y="184" fill="#0e191d" font-size="25" font-weight="750">140 °C</text>
<text x="232" y="334" fill="#0e191d" font-size="23" font-weight="750">85 °C</text>
<text x="289" y="334" fill="#294650" font-size="17" font-weight="650">≈ 0:50*</text>
<path d="M218 309L240 282" fill="none" stroke="#967746" stroke-width="2"/>
<text x="244" y="280" fill="#6b5638" font-size="15" font-weight="800">PONTO DE RETORNO</text>
<text x="750" y="73" fill="#0e191d" font-size="25" font-weight="750">202 °C</text>
<path d="M650 117V348" stroke="#967746" stroke-width="2" stroke-dasharray="7 7"/>
<circle cx="650" cy="115" r="7" fill="#d9b87d" stroke="#0e191d" stroke-width="2"/>
<rect x="377" y="83" width="219" height="47" rx="23" fill="#294650"/>
<text x="398" y="114" fill="#fff" font-size="21" font-weight="750">RoR 18 °C/min</text>
<path d="M485 130L485 150" fill="none" stroke="#294650" stroke-width="2" stroke-dasharray="4 4"/>
<text x="671" y="164" fill="#6b5638" font-size="15" font-weight="800">1º ESTALO · FIRST CRACK</text>
<text x="26" y="229" fill="#294650" font-size="14" font-weight="700" transform="rotate(-90 26 229)">LEITURA DA SONDA</text>
<text x="406" y="437" fill="#294650" font-size="15" font-weight="700" letter-spacing="1.2">SEQUÊNCIA DA TORRA →</text>
<g font-size="15" font-weight="800" text-anchor="middle"><rect x="122" y="367" width="240" height="40" rx="4" fill="#dde8e4"/><text x="242" y="393" fill="#294650">SECAGEM</text><rect x="368" y="367" width="280" height="40" rx="4" fill="#e6d9bb"/><text x="508" y="393" fill="#294650">REAÇÕES DE MAILLARD</text><rect x="654" y="367" width="212" height="40" rx="4" fill="#d9b87d"/><text x="760" y="393" fill="#0e191d">DESENVOLVIMENTO</text></g>
</g>
</svg>