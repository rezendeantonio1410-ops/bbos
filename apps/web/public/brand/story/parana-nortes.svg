<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Paraná ampliado: Norte Novo e Norte Pioneiro</title><desc id="desc">Contorno geográfico do Paraná. Na borda norte, duas áreas ilustrativas indicam o Norte Novo, junto a Londrina e Maringá, e o Norte Pioneiro, junto a Cornélio Procópio e Jacarezinho. As áreas não representam limites oficiais.</desc>
