<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Da rocha ao fruto: uma leitura do solo</title>
<desc id="desc">Corte ilustrativo de um cafeeiro enraizado no solo, com água e nutrientes próximos às raízes, rocha basáltica abaixo e uma lupa ampliando os minerais da fração argila. Frutos estão na planta; a ilustração não prevê o sabor do café.</desc>
