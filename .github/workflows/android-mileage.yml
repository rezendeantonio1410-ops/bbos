name: BBOS Android mileage

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-mileage.yml'
  workflow_dispatch:
    inputs:
      web_origin:
        description: Origem HTTPS do BBOS para o piloto
        default: 'https://app.bispocoffees.com.br'
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35"
      - name: Build pilot APK
        working-directory: mobile/android
        env:
          BBOS_WEB_ORIGIN: ${{ inputs.web_origin || 'https://app.bispocoffees.com.br' }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug "-PbbosWebOrigin=$BBOS_WEB_ORIGIN"
      - uses: actions/upload-artifact@v4
        with:
          name: bbos-quilometragem-android-piloto
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
