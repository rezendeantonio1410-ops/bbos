name: Signa Render homologation configuration guard

on:
  pull_request:
    paths:
      - render.homolog.yaml
      - .github/workflows/signa-render-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated configuration and reject unsafe variants
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'
          def validate(doc)
            assert = ->(ok, label) { raise ArgumentError, label unless ok }
            assert.call(doc.keys.sort == %w[databases services], 'unexpected blueprint resources')
            dbs = doc.fetch('databases')
            assert.call(dbs.size == 1, 'expected a single isolated database')
            db = dbs.first
            assert.call(db['name'] == 'bbos-postgres-homolog' &&
                        db['databaseName'] == 'bbos_homolog' &&
                        db['user'] == 'bbos_homolog' &&
                        db['ipAllowList'] == [], 'database identity or external access')
            services = doc.fetch('services')
            assert.call(services.map { |s| s['name'] }.sort ==
                        %w[bbos-api-homolog bbos-app-homolog], 'unexpected services')
            services.each do |s|
              assert.call(s['type'] == 'web' && s['branch'] == 'test/signa-release-reconcile-20261125-rc2' &&
                          s['autoDeployTrigger'] == 'off' && !s.key?('autoDeploy'),
                          'branch, service type or automatic deploy')
              assert.call(!s.key?('envVarGroups') && !s.key?('preDeployCommand'), 'unexpected inherited configuration')
              rows = s.fetch('envVars')
              keys = rows.map { |e| e.fetch('key') }
              assert.call(keys.uniq.size == keys.size, 'duplicate environment keys')
              env = rows.to_h { |e| [e.fetch('key'), e.reject { |k, _| k == 'key' }] }
              if s['name'] == 'bbos-api-homolog'
                expected = {
                  'NODE_ENV' => {'value' => 'production'},
                  'DATABASE_URL' => {'fromDatabase' => {'name' => 'bbos-postgres-homolog', 'property' => 'connectionString'}},
                  'BBOS_EMPTY_DATABASE_BOOTSTRAP' => {'value' => 'true'},
                  'BBOS_RESETTABLE_DATABASE_NAME' => {'value' => 'bbos_homolog'},
                  'BBOS_HOMOLOG_SEED' => {'value' => 'true'},
                  'BBOS_HOMOLOG_PASSWORD' => {'sync' => false},
                  'BBOS_TERM_CREDIT_APPROVER_EMAILS' => {'value' => 'admin@homolog.test'},
                  'BBOS_SCHEDULED_JOBS_DISABLED' => {'value' => 'true'},
                  'BBOS_BACKGROUND_JOBS_ENABLED' => {'value' => 'false'},
                  'BBOS_RELEASE' => {'value' => 'signa-homolog'}
                }
              else
                expected = {
                  'NODE_ENV' => {'value' => 'production'},
                  'BBOS_API_INTERNAL_URL' => {'sync' => false}
                }
              end
              assert.call(env == expected, 'unexpected environment configuration')
            end
          end
          doc = YAML.safe_load_file('render.homolog.yaml', aliases: false)
          validate(doc)
          mutations = {
            'automatic deploy' => ->(d) { d['services'][0]['autoDeployTrigger'] = 'commit' },
            'obsolete branch' => ->(d) { d['services'][1]['branch'] = 'feature/signa-private-customers-analytics' },
            'production database' => ->(d) { d['services'][0]['envVars'].find { |e| e['key'] == 'DATABASE_URL' }['fromDatabase']['name'] = 'bbos-postgres-staging' },
            'external database access' => ->(d) { d['databases'][0]['ipAllowList'] = [{'source' => '0.0.0.0/0'}] },
            'background jobs' => ->(d) { d['services'][0]['envVars'].find { |e| e['key'] == 'BBOS_BACKGROUND_JOBS_ENABLED' }['value'] = 'true' },
            'integration credentials' => ->(d) { d['services'][0]['envVars'] << {'key' => 'BLING_TOKEN', 'sync' => false} },
            'hardcoded upstream' => ->(d) { d['services'][1]['envVars'].find { |e| e['key'] == 'BBOS_API_INTERNAL_URL' }.replace({'key' => 'BBOS_API_INTERNAL_URL', 'value' => 'https://production.invalid'}) }
          }
          mutations.each do |name, mutate|
            candidate = Marshal.load(Marshal.dump(doc))
            mutate.call(candidate)
            begin
              validate(candidate)
            rescue ArgumentError
              puts "PASS: rejected #{name}"
              next
            end
            abort "FAIL: accepted #{name}"
          end
          puts 'PASS: static isolated blueprint configuration; live Render isolation remains unverified.'
          RUBY
