name: BBOS validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare workspace packages
        run: |
          pnpm --filter @bbos/database build
          pnpm --filter @bbos/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  signa-database:
    name: Signa database migrations and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbos_signa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bbos_signa_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Signa staging preflight syntax and fail-closed policy
        run: |
          bash -n scripts/signa-db-readiness.sh
          if DATABASE_URL=postgresql://invalid:invalid@127.0.0.1:1/invalid bash scripts/signa-db-readiness.sh /tmp/signa-backup-does-not-exist.dump; then
            echo "Signa preflight must reject missing backup" >&2
            exit 1
          fi

      - name: Apply migrations to disposable database
        run: scripts/signa-db-prepare.sh

      - name: Integration, isolation, concurrency and price tests
        run: scripts/signa-db-integration.sh
