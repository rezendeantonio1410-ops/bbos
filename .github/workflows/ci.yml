name: BBOS validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare workspace packages
        run: |
          pnpm --filter @bbos/database build
          pnpm --filter @bbos/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  signa-database:
    name: Signa database migrations and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbos_signa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bbos_signa_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations to disposable database
        run: scripts/signa-db-prepare.sh

      - name: Integration, isolation, concurrency and price tests
        run: scripts/signa-db-integration.sh

  empty-database-bootstrap:
    name: Empty database bootstrap through deploy path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbos_bootstrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bbos_bootstrap_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bbos/database build

      - name: Without the flag, an empty database still fails as before
        run: |
          if pnpm db:migrate:deploy; then echo "expected legacy failure without flag" >&2; exit 1; fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Bootstrap the empty database (flag set)
        env:
          BBOS_EMPTY_DATABASE_BOOTSTRAP: "true"
        run: |
          set -o pipefail
          pnpm db:migrate:deploy 2>&1 | tee "$RUNNER_TEMP/bbos-bootstrap.log"

      - name: Detect new legacy omissions and verify empty-bootstrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostic baseline only; known historical omissions remain release blockers.
          # Fail on any new statement or SQLSTATE, including UNKNOWN.
          while IFS= read -r omission; do
            case "$omission" in
              "migration=20260807143000_product_catalog_persistence_v1 statement=5 sqlstate=42P07"|"migration=20260807230000_cost_engine_v1_traceability statement=8 sqlstate=42701"|"migration=20260807230000_cost_engine_v1_traceability statement=12 sqlstate=42P07"|"migration=20260807230000_cost_engine_v1_traceability statement=13 sqlstate=42710"|"migration=20261012173000_roaster_operational_load_17kg statement=3 sqlstate=55P04"|"migration=20261015124500_storefront_payment_fiscal_recovery statement=1 sqlstate=42703"|"migration=20261015124500_storefront_payment_fiscal_recovery statement=5 sqlstate=42703"|"migration=20261015124500_storefront_payment_fiscal_recovery statement=6 sqlstate=42703")
                echo "::warning::Known historical omission (not release acceptance): $omission"
                ;;
              *) echo "::error::Unexpected legacy omission: $omission"; exit 1 ;;
            esac
          done < <(sed -n 's/^.*Bootstrap: legacy statement skipped //p' "$RUNNER_TEMP/bbos-bootstrap.log")
          # Data-recovery statements are relevant to populated databases; this gate
          # proves only the empty rehearsal has no source orders or cost events.
          checks=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -F '|' <<'SQL'
          SELECT check_name, passed FROM (VALUES
            ('production_orders_empty', NOT EXISTS (SELECT 1 FROM public."ProductionOrder")),
            ('cost_events_empty', NOT EXISTS (SELECT 1 FROM public."CostEvent")),
            ('storefront_orders_empty', NOT EXISTS (SELECT 1 FROM public."StorefrontOrder")),
            ('storefront_sales_order_column_present', EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='StorefrontOrder' AND column_name='salesOrderId')),
            ('gas_enum_present', EXISTS (SELECT 1 FROM pg_enum e JOIN pg_type t ON e.enumtypid=t.oid JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='public' AND t.typname='CostType' AND e.enumlabel='GAS'))
          ) AS checks(check_name, passed) ORDER BY check_name;
          SQL
          )
          # Emit only fixed check names and booleans, never row contents.
          printf '%s\n' "$checks"
          failed=0
          for check in production_orders_empty cost_events_empty storefront_orders_empty storefront_sales_order_column_present gas_enum_present; do
            if ! grep -Fxq "$check|t" <<< "$checks"; then
              echo "::error::Bootstrap prerequisite failed: $check"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: History complete and second deploy is a no-op
        env:
          BBOS_EMPTY_DATABASE_BOOTSTRAP: "true"
        run: |
          expected=$(ls -d packages/database/prisma/migrations/*/ | wc -l)
          applied=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")
          echo "applied=$applied expected=$expected"; test "$applied" = "$expected"
          pnpm db:migrate:deploy | tee deploy.log; grep -q "No pending migrations" deploy.log
          psql "$DATABASE_URL" -Atc "SELECT to_regclass('public.\"PartnerOrderDraft\"'), to_regclass('public.\"PartnerOrderSubmission\"'), to_regclass('public.\"PartnerEndCustomer_active_scoped_cnpj_unique\"')" | grep -qx '"PartnerOrderDraft"|"PartnerOrderSubmission"|"PartnerEndCustomer_active_scoped_cnpj_unique"'

  signa-authenticated-e2e:
    name: Signa authenticated API on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbos_signa_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bbos_signa_e2e
      BBOS_EMPTY_DATABASE_BOOTSTRAP: "true"
      BBOS_SCHEDULED_JOBS_DISABLED: "true"
      BBOS_HOMOLOG_SEED: "true"
      SIGNA_E2E_API: http://127.0.0.1:3101/api
      HOST: 127.0.0.1
      PORT: "3101"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter @bbos/api build
      - name: Migrate empty database
        run: pnpm db:migrate:deploy
      - name: Seed synthetic accounts only
        shell: bash
        run: |
          password="Aa1$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "SIGNA_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          BBOS_HOMOLOG_PASSWORD="$password" node packages/database/prisma/seed-signa-homolog.mjs
      - name: Start local API and run authenticated checks
        shell: bash
        run: |
          (cd apps/api && node dist/main.js) > "$RUNNER_TEMP/signa-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            status=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' "$SIGNA_E2E_API/partner-portal/summary" || true)
            case "$status" in 401|403) ready=1; break;; esac
            if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "Local API not ready"; exit 1; fi
          node --check scripts/signa-homolog-e2e.mjs
          node scripts/signa-homolog-e2e.mjs
