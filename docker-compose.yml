services:
  postgres:
    image: postgres:16-alpine
    container_name: bbos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bbos
      POSTGRES_USER: bbos
      POSTGRES_PASSWORD: bbos
    ports:
      - "5432:5432"
    volumes:
      - bbos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbos -d bbos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bbos_postgres_data:
