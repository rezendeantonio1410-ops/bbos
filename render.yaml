services:
  - type: web
    name: bbos-api-staging
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:migrate:staging && pnpm --filter @bbos/api build
    startCommand: pnpm --filter @bbos/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bbos-postgres-staging
          property: connectionString
      - key: WEB_URL
        sync: false
      - key: BBOS_STAGING_USER
        sync: false
      - key: BBOS_STAGING_PASSWORD
        sync: false

  - type: web
    name: bbos-web-staging
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @bbos/web build
    startCommand: pnpm --filter @bbos/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BBOS_STAGING_USER
        sync: false
      - key: BBOS_STAGING_PASSWORD
        sync: false

databases:
  - name: bbos-postgres-staging
    databaseName: bbos
    user: bbos
    plan: free
