services:
  - type: web
    name: bbos-api-staging
    runtime: node
    rootDir: .
    branch: codex/storefront-rc1-final
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:migrate:deploy && pnpm db:seed:coffee-references && pnpm --filter @bbos/api build
    startCommand: pnpm --filter @bbos/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bbos-postgres-staging
          property: connectionString
      - key: WEB_URL
        sync: false
      - key: BBOS_STAGING_USER
        sync: false
      - key: BBOS_STAGING_PASSWORD
        sync: false
      - key: BBOS_BOOTSTRAP_ADMIN_ENABLED
        sync: false
      - key: BBOS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BBOS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BBOS_BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: STOREFRONT_COMPANY_ID
        sync: false
      - key: STOREFRONT_WEB_URL
        sync: false
      - key: STOREFRONT_API_PUBLIC_URL
        sync: false
      - key: STOREFRONT_QUOTE_SECRET
        generateValue: true
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: ORDER_TRACKING_SECRET
        generateValue: true
      - key: MELHOR_ENVIO_API_URL
        sync: false
      - key: MELHOR_ENVIO_ACCESS_TOKEN
        sync: false
      - key: SHIPPING_ORIGIN_POSTAL_CODE
        sync: false
      - key: MELHOR_ENVIO_USER_AGENT
        value: BBOS Bispo Coffees (jrezende@bispocoffees.com)
      - key: SHIPPING_SENDER_DOCUMENT
        sync: false

  - type: web
    name: bbos-web-staging
    runtime: node
    rootDir: .
    branch: codex/storefront-rc1-final
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @bbos/web build
    startCommand: pnpm --filter @bbos/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: BBOS_STAGING_USER
        sync: false
      - key: BBOS_STAGING_PASSWORD
        sync: false

databases:
  - name: bbos-postgres-staging
    databaseName: bbos
    user: bbos
    plan: free
